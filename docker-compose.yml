name: gestao-esportiva

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: gestao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao_local
      POSTGRES_DB: gestao_esportiva
      # Locale pt-BR para ordenação e comparação de texto coerentes com o produto.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pt-BR'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestao -d gestao_esportiva']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: gestao-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
