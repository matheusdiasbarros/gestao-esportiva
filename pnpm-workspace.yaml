packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de instalação executam código arbitrário na sua máquina e no CI.
# O pnpm exige aprovação explícita de cada um — aprove só o que precisa de fato.
allowBuilds:
  # Telemetria de terceiros. Não há motivo para o build deste projeto reportar
  # instalações para um serviço externo.
  '@scarf/scarf': false
  # Resolvedor nativo usado pelo ESLint. Precisa compilar/baixar o binário da
  # plataforma na instalação, senão o lint não roda.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.17'
  - '@expo/fingerprint@0.20.9'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.9'
  - '@expo/prebuild-config@57.0.13'
  - '@expo/router-server@57.0.7'
  - expo-asset@57.0.13
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo@57.0.15
  - '@expo/metro-runtime@57.0.12'
  - '@expo/ui@57.0.12'
  - expo-linking@57.0.7
  - expo-router@57.0.15
